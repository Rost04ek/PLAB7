[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "task-manager"
version = "0.7.0"
description = "Task management application with SQLite and SQLAlchemy persistence layer (Variant 14)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
task-manager = "task_manager.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
